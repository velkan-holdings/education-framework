# Education Framework engineering ledger. Schema: studio repository-roadmap v1 (~/Stuff/.portfolio/templates/repository-roadmap.yaml). Created 2026-10-09 by the studio lane (GOV-S2.3d).
# Mode: VALIDATE (plan 2026-10-08 section F3; mode lives on the project card, not here).
# Boundary: public repository for the reference curriculum, its documentation and static site only.
# Application work lives in a separate repository with its own ledger.
schema_version: 1
project_id: education-framework-app
repository: velkan-holdings/education-framework
trust_boundary: public-reference-documentation
current_outcome: Keep the public reference curriculum site accurate and its integrity checks passing, without expanding scope.
wip_limit: 1

releases:
  - id: R1
    title: Documentation and site baseline
    outcome: The documentation, repository references and integrity checks are verified consistent with the repository as it stands.

work_packages:
  - id: FW-R1.1
    release: R1
    title: Documentation and site integrity baseline
    outcome: A recorded result of the integrity suite and a list of stale references, from a clean checkout.
    sizing: unestimated
    admission:
      rationale: Establishes the true state of the public documentation before any content expansion.
      evidence: README.md, docs/ and tools/ in this repository.
    slices:
      - id: FW-R1.0
        title: Rebuild content and integrity checks
        outcome: Content rebuild and integrity checks exist on main.
        status: verified
        depends_on: []
        acceptance:
          - The commit exists on main.
        verify:
          - git cat-file -e 4b3c94cdcfa441737ee47132636a3fac74981772
        delivery: repository
        blocker: null
        evidence:
          commit: 4b3c94cdcfa441737ee47132636a3fac74981772
          deployment: null
          verified_at: "2026-08-27"
      - id: FW-R1.1a
        title: Baseline verification and stale-reference inventory (discovery)
        outcome: The result of the full test, build and audit run is recorded, and every reference to a superseded GitHub organisation name is listed.
        status: ready
        depends_on: []
        acceptance:
          - npm ci, npm test, npm run build and the audit scripts are run once from a clean checkout and their outcomes are written down.
          - Every occurrence of the superseded organisation name is listed with file and line; the known one is the remoteUrl in tools/portfolio-credentials/capability.json.
        verify:
          - npm ci && npm test && npm run build
          - git grep -n "velkan-corp"
        delivery: documentation
        blocker: null
        evidence:
          commit: null
          deployment: null
          verified_at: null

owner_actions:
  - id: OWNER-1
    action: Approve correcting the stale organisation reference in tools/portfolio-credentials/capability.json. Recommendation - approve, as a reviewed change, because that directory is the reviewed credential runner and must not be edited without review.
    owner: Pedro
    status: open
    blocks: []
    evidence: null

backlog:
  - id: IDEA-1
    title: Further curriculum content or site features.
    admission_trigger: A baseline result from FW-R1.1a and an owner-originated request; no content expansion is admitted under VALIDATE.
